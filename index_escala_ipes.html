<style>
/* Layout: cabeçalho verde-ipê, faixa de resumo, duas abas (Pendências / Funcionários) em coluna única que vira 2 colunas no desktop */
:root{

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16140F; --surface:#211E17; --ink:#F1EBDD; --ink2:#B3AB98; --line:#3A3528; --title:#F1EBDD;
  --green:#2F5A41; --green-ink:#FFFFFF; --ipe:#E3A72E; --ipe-ink:#2A1E03;
  --ok:#7CC48F; --ok-bg:#1B2F21; --warn:#E3B04F; --warn-bg:#3A2F12; --bad:#EF8B8B; --bad-bg:#401D1D; --info:#E3B04F; --info-bg:#3A2F12;
  --night:#0E0D0A; --night-ink:#F1EBDD; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16140F; --surface:#211E17; --ink:#F1EBDD; --ink2:#B3AB98; --line:#3A3528; --title:#F1EBDD;
  --green:#2F5A41; --green-ink:#FFFFFF; --ipe:#E3A72E; --ipe-ink:#2A1E03;
  --ok:#7CC48F; --ok-bg:#1B2F21; --warn:#E3B04F; --warn-bg:#3A2F12; --bad:#EF8B8B; --bad-bg:#401D1D; --info:#E3B04F; --info-bg:#3A2F12;
  --night:#0E0D0A; --night-ink:#F1EBDD; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:1040px;margin:0 auto}
.logo-stem{stroke:var(--title)}
header{padding:26px 0 0}

h1{font-family:var(--head);font-weight:600;font-size:25px;margin:0;letter-spacing:-.2px;color:var(--title);text-wrap:balance}
.sub{color:var(--ink2);font-size:13.5px;margin-top:3px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:16px}
.stat{background:rgba(255,255,255,.1);border-radius:8px;padding:8px 10px;min-width:0}
.stat b{display:block;font-family:var(--head);font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;opacity:.85}
.stat.hot{background:var(--ipe);color:var(--ipe-ink)}
#v-adm .stats{margin:0 0 16px}
#v-adm .stat{background:var(--surface);border:1px solid var(--line)}
#v-adm .stat span{opacity:1;color:var(--ink2)}
#v-adm .stat.hot,#v-adm .stat.hot span{background:var(--ipe);border-color:var(--ipe);color:var(--ipe-ink)}
nav{display:flex;gap:28px;margin-top:20px;border-bottom:1px solid var(--line)}
nav button{font:inherit;font-size:14.5px;color:var(--ink2);background:transparent;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:10px 2px;cursor:pointer}

.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:5px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--green);color:var(--green-ink);border-color:var(--green)}
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer}
.btn.pri{background:var(--ipe);color:var(--ipe-ink);border-color:var(--ipe)}
.btn.go{background:var(--green);color:var(--green-ink);border-color:var(--green)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{background:transparent}
h2{font-family:var(--head);font-size:15px;margin:22px 0 8px;display:flex;align-items:center;gap:8px}
h2 .n{font-size:12px;background:var(--line);color:var(--ink2);border-radius:99px;padding:1px 8px}

.list{display:grid;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;min-width:0}

.card .t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.card .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;grid-column:1;min-width:0}

.card .act{grid-column:2;grid-row:1/3;display:flex;flex-direction:column;gap:6px;align-items:stretch;justify-content:flex-start}
.tag{font-size:12px;border-radius:6px;padding:1px 8px;background:var(--line);color:var(--ink2)}
.tag.own{background:var(--info-bg);color:var(--info);font-weight:600}
.tag.alta{background:var(--bad-bg);color:var(--bad);font-weight:600}
.tag.media{background:var(--warn-bg);color:var(--warn)}
.tag.ok{background:var(--ok-bg);color:var(--ok);font-weight:600}
details.done summary{cursor:pointer;font-family:var(--head);font-weight:700;font-size:15px;margin:22px 0 8px}
.empty{border:1px dashed var(--line);border-radius:10px;padding:26px 18px;text-align:center;color:var(--ink2);background:var(--surface)}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.day{font:inherit;flex:1 0 auto;min-width:58px;text-align:center;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:6px 8px;cursor:pointer}
.day small{display:block;color:var(--ink2);font-variant-numeric:tabular-nums}
.day[aria-selected="true"]{background:var(--green);color:var(--green-ink);border-color:var(--green)}
.day[aria-selected="true"] small{color:var(--green-ink);opacity:.8}
.day.today b::after{content:" •";color:var(--ipe)}
.shifts{display:grid;grid-template-columns:1fr 1fr;gap:14px}

.shift{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.shift .hd{padding:12px 14px;background:var(--green);color:var(--green-ink)}
.shift.night .hd{background:var(--night);color:var(--night-ink)}
.shift .hd b{font-family:var(--head);font-size:17px;display:block}
.shift .hd span{opacity:.85;font-size:13px}
.task{display:grid;grid-template-columns:64px 1fr auto;gap:10px;padding:10px 14px;border-top:1px solid var(--line);align-items:start}
.task .h{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink2);font-size:13px;line-height:1.5}
.task .h em{display:block;font-style:normal;font-weight:400;font-size:12px}
.task .tt{overflow-wrap:anywhere}
.task .nn{color:var(--ink2);font-size:12.5px}
.task.done .tt{text-decoration:line-through;color:var(--ink2)}
.task input[type=checkbox]{width:22px;height:22px;accent-color:var(--ok);margin:0}
.off{padding:20px 14px;color:var(--ink2)}
.legend{color:var(--ink2);font-size:12.5px;margin-top:12px}
.ov{position:fixed;inset:0;background:rgba(10,20,15,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:0 0 env(safe-area-inset-bottom,0px)}
.ov[hidden]{display:none!important}
.sheet{background:var(--surface);width:min(520px,100%);max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px;display:grid;gap:10px}

.sheet h3{margin:0;font-family:var(--head);font-size:18px}
label{display:grid;gap:3px;font-weight:600;font-size:13px}
input,select,textarea{font:inherit;font-weight:400;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2>*{min-width:0}
.dias{display:flex;flex-wrap:wrap;gap:6px}
.dias label{display:flex;gap:4px;align-items:center;font-weight:500;border:1px solid var(--line);border-radius:99px;padding:3px 10px}
.dias input{width:auto}
.fr{display:flex;gap:8px;justify-content:space-between;margin-top:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;z-index:30;max-width:90vw}
.note-ro{background:var(--info-bg);color:var(--info);border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:13px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

.task.now{background:var(--warn-bg)}
.task input[type=checkbox]{cursor:pointer}
.upd{color:var(--ink2);font-size:12.5px;margin-top:10px}
.login{max-width:360px;margin:60px auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;gap:10px}
.login h2{margin:0}.err{color:var(--bad);font-size:13px;min-height:18px}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.col{display:grid;gap:8px;min-width:0}
.col .card{grid-template-columns:1fr}
.colh{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:10px;font-family:var(--head);font-size:15px}
.colh .n{font-family:var(--font);font-size:12px;background:rgba(0,0,0,.12);border-radius:99px;padding:1px 9px}
.colh.alta{background:var(--bad-bg);color:var(--bad)}
.colh.media{background:var(--warn-bg);color:var(--warn)}
.colh.baixa{background:var(--line);color:var(--ink2)}
.ptabs{display:none;gap:6px;margin-bottom:12px;flex-wrap:wrap}
@media (max-width:820px){.cols{grid-template-columns:1fr}.ptabs{display:flex}.col:not(.on){display:none}.colh{display:none}}
.chk{display:flex;gap:6px;align-items:center;font-weight:400;font-size:13px}.chk input{width:auto}

nav{display:flex;gap:28px;margin-top:20px;border-bottom:1px solid var(--line)}
nav button{font:inherit;font-size:14.5px;color:var(--ink2);background:transparent;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:10px 2px;cursor:pointer}
nav button[aria-selected="true"]{color:var(--title);border-bottom-color:var(--ipe);font-weight:600}
[hidden]{display:none!important}
</style></head><body>

const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}

 if(q==='fred'&&!FRED[dow]){box.appendChild(el('div','off','Fred está de folga neste dia.'));return box}
 const T=ROT.filter(t=>t.quem===q&&(t.dias||[]).includes(dow)).sort((a,b)=>hkey(a.inicio)-hkey(b.inicio));
 const dt=iso(dateOf(dow));const isToday=dt===iso(hoje);const nowm=hoje.getHours()*60+hoje.getMinutes();
 T.forEach(t=>{
  const key=dt+'_'+t.id;const row=el('div','task');if(mem[key])row.classList.add('done');
  if(q==='fred'&&isToday&&nowm>=hkey(t.inicio)&&nowm<hkey(t.fim))row.classList.add('now');
  const h=el('div','h',t.inicio);if(t.fim)h.appendChild(el('em',null,'até '+t.fim));row.appendChild(h);
  const tt=el('div');tt.appendChild(el('div','tt',t.titulo));if(t.nota)tt.appendChild(el('div','nn',t.nota));row.appendChild(tt);
  if(isToday){const c=el('input');c.type='checkbox';c.checked=!!mem[key];c.setAttribute('aria-label','Marcar feito: '+t.titulo);
   c.onchange=()=>{if(c.checked)mem[key]=1;else delete mem[key];save();row.classList.toggle('done',c.checked)};row.appendChild(c)}
  else row.appendChild(el('span'));
  box.appendChild(row)});
 return box}
function render(){renderDias();const b=$('#turnos');b.textContent='';const g=el('div','shifts');g.append(shift('fred',dia),shift('noite',dia));b.appendChild(g);
 $('#leg').textContent='As marcações de "feito" ficam só neste aparelho. Tarefas da madrugada (00:00 a 06:59) pertencem ao turno que começou na noite anterior.'}
render();

const d64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function dec(pw){
 const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:d64(ENC.s),iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:d64(ENC.i)},k,d64(ENC.c));
 return JSON.parse(new TextDecoder().decode(pt))}
let DATA=null,tab='a',ptab='alta';
const PR={alta:'Alta',media:'Média',baixa:'Baixa'};
const ST={fazer:'A fazer',andamento:'Em andamento',feito:'Feito, aguarda conferência',conferido:'Conferido'};
function renderAdm(){
 const P=DATA.p,done=P.filter(p=>p.status==='conferido'),open=P.filter(p=>p.status!=='conferido');
 const s=$('#stats');s.textContent='';
 [['Em andamento',open.length,1],['Concluídos',done.length,0]].forEach(([l,n,h])=>{const c=el('div','stat'+(h?' hot':''));c.append(el('b',null,String(n)),el('span',null,l));s.appendChild(c)});
 $('#s1').setAttribute('aria-pressed',String(tab==='a'));$('#s2').setAttribute('aria-pressed',String(tab==='c'));
 const L=$('#list');L.textContent='';const arr=tab==='a'?open:done;
 const pt=el('div','ptabs');['alta','media','baixa'].forEach(k=>{const n=arr.filter(p=>p.prioridade===k).length;const b=el('button','chip',PR[k]+' ('+n+')');b.setAttribute('aria-pressed',String(ptab===k));b.onclick=()=>{ptab=k;renderAdm()};pt.appendChild(b)});L.appendChild(pt);
 const cols=el('div','cols');
 ['alta','media','baixa'].forEach(k=>{
  const items=arr.filter(p=>p.prioridade===k).sort((a,b)=>a.ordem-b.ordem);
  const col=el('div','col'+(ptab===k?' on':''));const h=el('div','colh '+k);h.append(el('b',null,'Prioridade '+PR[k]),el('span','n',String(items.length)));col.appendChild(h);
  if(!items.length)col.appendChild(el('div','empty','Nenhum item.'));
  items.forEach(p=>{const c=el('div','card');c.appendChild(el('div','t',p.titulo));
   const m=el('div','meta');m.append(el('span','tag',p.grupo),el('span','tag',ST[p.status]||''));c.appendChild(m);
   if(p.nota)c.appendChild(el('div','note',p.nota));col.appendChild(c)});
  cols.appendChild(col)});
 L.appendChild(cols)}
async function enter(pw,remember){
 pw=String(pw).trim();
 if(!(window.crypto&&crypto.subtle)){$('#err').textContent='Este navegador não abre a senha. Abra o link direto no Chrome ou Safari.';return false}
 try{DATA=await dec(pw)}catch(e){if(e&&e.name!=='OperationError')$('#err').textContent='Erro: '+(e.message||e.name);else $('#err').textContent='Senha incorreta.';return false}
 if(remember){try{localStorage.setItem('ipes_adm',pw)}catch(e){}}
 $('#lg').hidden=true;$('#app').hidden=false;$('#upd').textContent='Atualizado em '+DATA.upd;renderAdm();return true}
$('#lg').onsubmit=async e=>{e.preventDefault();$('#err').textContent='';
 await enter($('#pw').value,$('#rem').checked)};
$('#s1').onclick=()=>{tab='a';renderAdm()};$('#s2').onclick=()=>{tab='c';renderAdm()};
(async()=>{let pw=null;try{pw=localStorage.getItem('ipes_adm')}catch(e){}
 if(pw&&!await enter(pw,false)){try{localStorage.removeItem('ipes_adm')}catch(e){}}})();

function aba(n){const adm=n==='adm';$('#v-func').hidden=adm;$('#v-adm').hidden=!adm;
 $('#tab-func').setAttribute('aria-selected',String(!adm));$('#tab-adm').setAttribute('aria-selected',String(adm));
 try{history.replaceState(null,'','#'+(adm?'administracao':'funcionarios'))}catch(e){}}
$('#tab-func').onclick=()=>aba('func');$('#tab-adm').onclick=()=>aba('adm');
if(location.hash==='#administracao')aba('adm');
</script></body></html>
